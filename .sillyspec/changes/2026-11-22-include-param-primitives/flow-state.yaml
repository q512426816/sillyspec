  prompt include 参数化与首批纪律原语抽取


  动机与背景：ROADMAP「mattpocock/skills 吸收路线」批 3b（依赖批 3a survey 已归档就绪）。批 3a 盘点（docs/sillyspec/prompt-primitives-survey.md）发现 B
  类 25 条散文级重复纪律段、高优 8 条跨阶段逐字/近逐字重复；现有 {{include:}} 机制（src/run/shared.js resolvePromptIncludes）无参数化管道，侧重差异只能整段复制改词。本变更落地
  include 参数化语法，并按 survey 施工顺序抽高优 2+5（零参数直抽）与高 4/9（参数化抽取），每批跑金档再生与 include 计数测试。


  成功标准：

  - resolvePromptIncludes 支持 {{include:name|key=value}} 参数化语法，模板内参数占位被实参替换；无参写法向后兼容，模板缺失仍保留占位符并 warn

