input: >-
  P0/P1 硬化：评审回收链与门禁接缝修复

  基于两个 dsh 会话导出（2026-10-20-session-page-dsh-alignment 变更的 z1 brainstorm/plan 会话与 z2 execute/verify
  会话）的六路子代理考古分析，sillyspec 工具自身暴露以下 P0/P1 缺陷需修复：

  P0-1 review-dispatch 平台评审产物回收链断裂：sillyhub-mcp/client.js 的 getWorkerResult 只投影 {workerId,status,artifacts}
  丢弃回答正文；review-dispatch.js 提取器仅 artifacts 单通道；失败文案不提 register-stage-review --from 救回路径——会话实证导致平台评审成功却被误降级 self
  自审并落错误审计行。

  P0-2 worktree apply --stash-dirty 恢复步静默留 git 冲突标记（下游 tsc 才暴露）；run verify --done 关键路径被平台同步阻塞，纯文档步骤挂起超 5
  分钟无输出（会话在该挂起点截断）。

  P1-1 machine-interface.js 的 stage-review-hint 探测只对 execute 生效，而 run/gates.js 的 Stage Review Gate 实拦
  brainstorm/plan/execute 三阶段——brainstorm 收口被伏击（实证损失 46 分钟+3 轮子代理评审）。

  P1-2 所有权接缝：handoff 交接块让新会话用新 SESSION_ID 但 owner 仍为旧会话，首个写操作必撞 15 分钟活跃窗；首调忘设 SESSION_ID 时匿名身份自锁须 --takeover；写操作命令缺
  --session flag。

  P1-3 Windows 税：worktree gitignore 探测把 spawnSync git EPERM 误报为未被忽略（实证 27 分钟排查+用户提权）；doctor 对损坏 local.yaml
  零提示；local.yaml 无 CLI 管理面手改易炸（实证 2h13m 用户等待）；后台子进程句柄未清理致 libuv 退出断言崩溃把成功调用变 exit 1（实证 2 次）。


  成功标准：

  - getWorkerResult 返回体含 worker 回答正文（向后兼容）；review-dispatch 提取器在 artifacts 缺失时从回答正文提取平衡 JSON；worker 终态原文落盘；失败文案先给
  salvage/--from 救回路径再谈降级；派发任务书注明宿主不支持 artifacts 时 JSON 放回答正文代码块

  - worktree apply 恢复步后机械扫描变更面冲突标记（<<<<<<< / ======= / >>>>>>>），命中即 exit 非零并列出文件

  - run verify --done 输出进度心跳，同步类 IO 移出关键路径后台化，不再静默挂起

  - stage-review-hint 探测覆盖 brainstorm/plan/execute 与 gates.js 拦截范围对齐；Stage Review 门输出含可粘贴的评审子代理 prompt 模板与
  register-stage-review 骨架指引

  - handoff 交接块原子转移所有权到新 SESSION_ID（或显式预告首个写操作需 --takeover）；写操作命令支持 --session flag；匿名占位所有权+同主机显式身份自动升级免 --takeover

  - worktree gitignore 探测区分探测失败（EPERM 等）与确实未忽略两种文案并内置一次重试

  - doctor 新增 local.yaml 可解析性检查项；新增 config known-failures add/remove 管理子命令

  - 后台 spec-sync 子进程退出前显式清理句柄，缓解 libuv 退出断言崩溃

  - 以上各项均有对应测试，变更测试面全绿
