  失败——这正是实测静默失效（archive-stage-claim 已修诚实告警）与本仓上一轮 pathspec 竞态即现即逝的系统性环境根源。实验实证（/tmp 探针）：裸 git status 确实重写 index
  字节（抢锁），GIT_OPTIONAL_LOCKS=0 下 index 字节不变（无锁窗口）；带 0 的 add/commit 照常工作（只禁机会性锁，真写的必需锁不受影响——git 官方为后台只读工具设计的开关）。


  成功标准：

  - git-helper.js 的 safeGit 与 git 两个 exec 点统一注入 GIT_OPTIONAL_LOCKS=0（env 合并语义：与调用方传入 env 展开合并，不裸替换丢 Windows 系统变量）——CLI
  自建的全部 git 子进程不再机会性抢 index.lock；写命令（add/commit 等）行为不变

  - watcher 等常驻/后台轮询进程经公共入口自动获得该行为（gitQuiet 委托 git），无需逐调用点改造

  - 测试覆盖：①经 git-helper 的 status 读调用在 stat 缓存脏场景下不改写 .git/index 字节（锁窗口消失的代理断言）；②带注入 env 的 add 照常暂存成功；③调用方自定义 env（如
  baseline checkpoint 的 GIT identity 注入）仍生效不被覆盖
