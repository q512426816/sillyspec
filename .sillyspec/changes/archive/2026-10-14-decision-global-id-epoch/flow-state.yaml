  - 蒸馏写面发号：新蒸馏条目 MUST 落全局号标题 ## D-<发号域>-NNN@vN（发号域=resolveDomains 首域、sanitizeDomain 同口径；NNN=该域前缀全域扫描 max+1，只增不复用）+
  字段行「原编号：<局部号>」（位置在「变更：」后、「锚点：」前——不破「文件：紧跟锚点」既有测试红线）+ 既有「变更：」行

