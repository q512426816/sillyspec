  - 纯函数四态可直测：同 sha 零告、异 sha 点名、仅临时索引（未 add 的新文件随 pathspec 提交）点名、仅真实索引（staged 但不在本次 pathspec）不点名；冲突态 stage 大于 0 条目忽略

  - 真仓集成测试：真实 git 钩子复现 055080e4 形态必告警且提交放行；干净流转与全量提交零误报

