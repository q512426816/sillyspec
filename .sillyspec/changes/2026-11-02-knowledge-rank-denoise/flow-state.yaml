  知识检索排序与降噪：四类缺陷转绿


  知识库检索存在已实证的排序与降噪缺陷，评测面（变更 0）已就位：score 契约违反（关键词表长冒充命中数）、词边界把 _ 当边界（node 命中 node_modules）、INDEX 的 fr/decisions 路由行混入面向人的
  entries、known-issues 已修复条目仍被注入、entries 无相关度排序。子代理方案审查修正三处：- 必须保持词边界（否则打断 kebab-case 变更名匹配，实测损失 568 命中对）；路由行不能全局剔除（会打掉
  implemented 决策在 search/prompt/execute 的可见性），改为独立 routeHits；scope-manual 属变更 2 另案。


  成功标准：

  - score 契约：buildSearchMatches 接收 query、score=实际命中标签数，合成条目输出 channel 字段；probe score-contract 转 GREEN

  - 词边界：两处统一 _ 为词字符、- 为边界（[^a-z0-9_]）；shingle 抽取保留 _- 整词并额外产出拆分片段；kebab-case 正反例单测（worktree 命中 2026-*-worktree-*、不命中
